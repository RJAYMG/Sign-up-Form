<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="bg-div">
            <div class="title">
                <img src="img/odin-lined.png" alt="">
                <p id="title">ODIN</p>
            </div>
            <p id="cred">Photo by Halie West on Unsplash</p>
        </div>
        <div class="form-div">
            <div class="inputs">
                <div class="input-div">
                    <h1 id="form-title">Let's do this!</h1>
                    <div class="row">
                        <div class="column">
                            <p><b>FIRST NAME</b></p>
                            <input type="text">
                            <p><b>EMAIL</b></p>
                            <input type="text">
                            <p><b>PASSWORD</b></p>
                            <input type="text" required>
                        </div>
                        <div class="column">
                            <p><b>LAST NAME</b></p>
                            <input type="text">
                            <p><b>PHONE NUMBER</b></p>
                            <input type="text">
                            <p><b>CONFIRM PASSWORD</b></p>
                            <input type="text" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
